<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/img/2_character_pepe/2_walk/W-24.png">
    <title>El Pollo Loco</title>
    <script src="models/keyboard.class.js"></script>
    <script src="models/drawableObject.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/sound-manager.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/statusbar.class.js"></script>
    <script src="models/bottleStatusbar.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coinStatusbar.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/throwableObject.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="models/world.class.js"></script>
    <script src="js/game.js"></script>
</head>

<body onload="init()">

    <h1>El Pollo Loco</h1>

    <canvas width="720" height="480" id="game-canvas">

    </canvas>

    <div id="mobile-controls" class="mobile-controls">
        <div class="mobile-controls-group">
            <button id="btn-left" class="control-btn" aria-label="Nach links">◄</button>
            <button id="btn-right" class="control-btn" aria-label="Nach rechts">►</button>
        </div>
        <div class="mobile-controls-group">
            <button id="btn-throw" class="control-btn" aria-label="Flasche werfen">●</button>
            <button id="btn-jump" class="control-btn" aria-label="Springen">▲</button>
        </div>
    </div>

    <button id="toggle-legend-btn" onclick="toggleLegend()">
        Steuerung anzeigen
    </button>



    <section id="controls-legend" class="legend hidden">
        <button id="close-legend-btn" class="close-legend-btn" onclick="hideLegend()" aria-label="Steuerung schließen">✖</button>
        <h2> Steuerung</h2>
        <div class="legend-columns">
            <div class="legend-column">
                <h3>Tastatur</h3>
                <dl class="controls-list">
                    <dt><kbd>←</kbd></dt>
                    <dd>Nach links bewegen</dd>

                    <dt><kbd>→</kbd></dt>
                    <dd>Nach rechts bewegen</dd>

                    <dt><kbd>↑</kbd></dt>
                    <dd>Springen</dd>

                    <dt><kbd>Space</kbd></dt>
                    <dd>Springen</dd>

                    <dt><kbd>D</kbd></dt>
                    <dd>Flasche werfen</dd>

                    <dt><kbd>Enter</kbd></dt>
                    <dd>Spiel starten/neustarten</dd>
                </dl>
            </div>

            <div class="legend-column">
                <h3>Mobile Steuerung</h3>
                <dl class="controls-list">
                    <dt><kbd>◄</kbd></dt>
                    <dd>Nach links bewegen</dd>

                    <dt><kbd>►</kbd></dt>
                    <dd>Nach rechts bewegen</dd>

                    <dt><kbd>▲</kbd></dt>
                    <dd>Springen</dd>

                    <dt><kbd>●</kbd></dt>
                    <dd>Flasche werfen</dd>
                </dl>
            </div>
        </div>
    </section>
</body>

</html>
